<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <title>PAC-COIN · 8-BIT MAZE</title>
</head>
<body>
  <div id="app">
    <div id="hud">
      <span id="hudLeft">SCORE 0</span>
      <span id="hudMid">STAGE 1</span>
      <span id="hudRight">♥♥♥</span>
    </div>
    <div id="gameWrap">
      <div id="game">
        <div id="startScreen">
          <div id="startCover" aria-hidden="true"></div>
          <button id="startButton" type="button" aria-label="Game start">
            <img src="/game-start.png" alt="GAME START" onerror="this.style.display='none';this.nextElementSibling.style.display='block'" />
            <span>GAME START</span>
          </button>
        </div>
        <div id="overlay">READY!</div>
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
 </body>
</html>
